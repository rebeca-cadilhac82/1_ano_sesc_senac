<!DOCTYPE html>

    <title>HTML Semântico</title>
    <link rel="stylesheet" href="style/style.css">
</head>
 
<body class="container-principal">
    <header class="cabecalho">
        <h1>Header (Cabeçalho)</h1>

            <div>

        </aside>
    </main>
 
    <footer class="rodape" >
        <h1>Footer (Rodapé)</h1>
        <address class="questao-5" >teste@testando.com</address>
